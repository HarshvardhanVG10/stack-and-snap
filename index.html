<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stack & Snap</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: linear-gradient(180deg, #1b1035 0%, #3a1f5d 60%, #6b2f6b 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #gameCanvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px; box-sizing: border-box; pointer-events: none;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #score { font-size: 32px; font-weight: 800; }
  #best { font-size: 14px; opacity: 0.8; margin-top: 2px; }
  #tip {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.75); font-size: 14px; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(10,4,25,0.72); color: #fff; text-align: center;
    gap: 14px; z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 40px; margin: 0; }
  #overlay p { margin: 0; font-size: 16px; opacity: 0.85; max-width: 320px; line-height: 1.5; }
  #overlay .scoreLine { font-size: 22px; font-weight: 700; }
  button.playBtn {
    margin-top: 10px; padding: 14px 36px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 999px; background: #ffcf4d; color: #2a1245;
    cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  button.playBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="best">Best: 0</div>
  </div>
</div>
<div id="tip">Tap or click to drop</div>
<div id="overlay">
  <h1>Stack & Snap</h1>
  <p>Drop objects onto the tilting tray. Stack as high as you can before it tips over. One tap to drop &mdash; that's it.</p>
  <button class="playBtn" id="playBtn">Play</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(function () {
  const { Engine, Render, Runner, World, Bodies, Body, Composite, Events, Vector } = Matter;

  const canvas = document.getElementById('gameCanvas');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');

  const BEST_KEY = 'stackSnapBest';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = 'Best: ' + best;

  const COLORS = ['#ff6b6b', '#ffd166', '#06d6a0', '#4cc9f0', '#c77dff', '#ff9f1c'];
  const SHAPES = ['box', 'circle', 'triangle'];

  let width, height;
  let engine, world, render, runner;
  let tray, trayConstraintAngle = 0;
  let currentBody = null;
  let dropX = 0;
  let score = 0;
  let running = false;
  let lastTiltTime = 0;
  let trayWidth = 0;
  let elapsed = 0;
  let lastFrameTime = 0;
  let gameOverTriggered = false;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    if (render) {
      render.options.width = width;
      render.options.height = height;
      render.canvas.width = width;
      render.canvas.height = height;
    }
  }
  window.addEventListener('resize', resize);

  function randomShapeBody(x, y) {
    const size = 26 + Math.random() * 20;
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    const type = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const options = {
      restitution: 0.05,
      friction: 0.9,
      frictionStatic: 1.2,
      density: 0.002,
      render: { fillStyle: color, strokeStyle: 'rgba(0,0,0,0.2)', lineWidth: 2 }
    };
    let body;
    if (type === 'circle') {
      body = Bodies.circle(x, y, size / 1.7, options);
    } else if (type === 'triangle') {
      body = Bodies.polygon(x, y, 3, size / 1.4, options);
    } else {
      body = Bodies.rectangle(x, y, size * 1.3, size * 1.3, options);
    }
    body.label = 'piece';
    return body;
  }

  function setup() {
    engine = Engine.create();
    world = engine.world;
    engine.gravity.y = 1;

    render = Render.create({
      canvas: canvas,
      engine: engine,
      options: {
        width, height,
        wireframes: false,
        background: 'transparent'
      }
    });
    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);

    trayWidth = Math.min(width * 0.6, 420);
    tray = Bodies.rectangle(width / 2, height * 0.78, trayWidth, 26, {
      isStatic: true,
      render: { fillStyle: '#f4a261', strokeStyle: '#2a1245', lineWidth: 3 },
      chamfer: { radius: 6 },
      label: 'tray'
    });

    const leftWall = Bodies.rectangle(-20, height / 2, 40, height * 2, { isStatic: true, render: { visible: false } });
    const rightWall = Bodies.rectangle(width + 20, height / 2, 40, height * 2, { isStatic: true, render: { visible: false } });

    World.add(world, [tray, leftWall, rightWall]);

    Events.on(engine, 'afterUpdate', gameLoop);
    Events.on(engine, 'collisionStart', onCollision);

    spawnNext();
  }

  function spawnNext() {
    dropX = width / 2;
    currentBody = randomShapeBody(dropX, 70);
    Body.setStatic(currentBody, true);
    World.add(world, currentBody);
  }

  function pointerX(evt) {
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    return Math.max(30, Math.min(width - 30, clientX));
  }

  function onPointerMove(evt) {
    if (!running || !currentBody) return;
    dropX = pointerX(evt);
    Body.setPosition(currentBody, { x: dropX, y: currentBody.position.y });
  }

  function onPointerDown(evt) {
    if (!running) return;
    if (!currentBody) return;
    Body.setStatic(currentBody, false);
    currentBody.label = 'piece-settled';
    currentBody = null;
    setTimeout(() => { if (running) spawnNext(); }, 550);
  }

  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('touchmove', (e) => { onPointerMove(e); }, { passive: true });
  canvas.addEventListener('touchstart', (e) => { onPointerDown(e); }, { passive: true });

  function onCollision(evt) {
    for (const pair of evt.pairs) {
      const labels = [pair.bodyA.label, pair.bodyB.label];
      if (labels.includes('piece') && labels.includes('piece')) continue;
    }
  }

  function tiltTray(now) {
    if (now - lastTiltTime < 6000) return;
    lastTiltTime = now;
    const maxAngle = 0.22;
    trayConstraintAngle = (Math.random() - 0.5) * 2 * maxAngle;
    Body.setAngle(tray, trayConstraintAngle);
    trayWidth = Math.max(140, trayWidth * 0.92);
    Body.scale(tray, trayWidth / (tray.bounds.max.x - tray.bounds.min.x), 1);
  }

  function computeScore() {
    const pieces = Composite.allBodies(world).filter(b => b.label.indexOf('piece') === 0 || b.label === 'piece-settled');
    if (pieces.length === 0) return 0;
    const trayTopY = tray.position.y;
    let maxHeight = 0;
    for (const p of pieces) {
      const h = trayTopY - p.position.y;
      if (h > maxHeight) maxHeight = h;
    }
    const settledCount = pieces.filter(p => p.label === 'piece-settled').length;
    return Math.max(0, Math.round(maxHeight / 3) + settledCount * 5);
  }

  function checkGameOver() {
    const pieces = Composite.allBodies(world).filter(b => b.label.indexOf('piece') === 0 || b.label === 'piece-settled');
    for (const p of pieces) {
      if (p.position.y > height + 60 || p.position.x < -80 || p.position.x > width + 80) {
        return true;
      }
    }
    return false;
  }

  function gameLoop() {
    if (!running) return;
    const now = performance.now();
    if (lastFrameTime) elapsed += now - lastFrameTime;
    lastFrameTime = now;

    tiltTray(now);

    score = computeScore();
    scoreEl.textContent = score;

    if (!gameOverTriggered && checkGameOver()) {
      gameOverTriggered = true;
      endGame();
    }
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bestEl.textContent = 'Best: ' + best;

    overlay.querySelector('h1').textContent = 'Toppled!';
    overlay.querySelector('p').innerHTML = '<span class="scoreLine">Score: ' + score + '</span>';
    playBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function resetWorld() {
    World.clear(world, false);
    Engine.clear(engine);
    Composite.clear(world, false);
    World.add(world, []);
  }

  function startGame() {
    overlay.classList.add('hidden');
    if (engine) {
      Render.stop(render);
      Runner.stop(runner);
    }
    score = 0;
    elapsed = 0;
    lastFrameTime = 0;
    lastTiltTime = performance.now();
    gameOverTriggered = false;
    scoreEl.textContent = '0';
    resize();
    setup();
    running = true;
  }

  playBtn.addEventListener('click', startGame);
  resize();
})();
</script>
</body>
</html>
