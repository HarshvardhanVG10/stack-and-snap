<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stack &amp; Snap</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: #14092b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 20px; box-sizing: border-box; pointer-events: none;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #score {
    font-size: 40px; font-weight: 900; letter-spacing: 1px;
    background: linear-gradient(180deg, #fff, #ffd98a);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45));
  }
  #best { font-size: 14px; opacity: 0.85; margin-top: 2px; font-weight: 600; }
  #tip {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.7); font-size: 14px; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4); font-weight: 600;
    animation: tipPulse 2.4s ease-in-out infinite;
  }
  @keyframes tipPulse { 0%,100% { opacity: .45; } 50% { opacity: .9; } }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(12,4,30,0.78); color: #fff; text-align: center;
    gap: 14px; z-index: 10; backdrop-filter: blur(6px);
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 46px; margin: 0; font-weight: 900; letter-spacing: 1px;
    background: linear-gradient(180deg, #ffe9a8, #ff9f43);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(255,159,67,0.35));
  }
  #overlay p { margin: 0; font-size: 16px; opacity: 0.85; max-width: 320px; line-height: 1.55; }
  #overlay .scoreLine { font-size: 26px; font-weight: 800; color: #ffe9a8; }
  #mascotRow { display: flex; gap: 10px; margin-bottom: 4px; }
  .mascot {
    width: 52px; height: 52px; border-radius: 14px; position: relative;
    animation: bounceM 1.6s ease-in-out infinite;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15), 0 6px 16px rgba(0,0,0,0.35);
  }
  .mascot:nth-child(2) { animation-delay: .2s; border-radius: 50%; }
  .mascot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounceM { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .mascot::before, .mascot::after {
    content: ""; position: absolute; top: 17px; width: 9px; height: 12px;
    background: #241335; border-radius: 50%;
  }
  .mascot::before { left: 12px; }
  .mascot::after { right: 12px; }
  .mascot .smile {
    position: absolute; left: 50%; top: 32px; transform: translateX(-50%);
    width: 16px; height: 8px; border-bottom: 3px solid #241335; border-radius: 0 0 16px 16px;
  }
  button.playBtn {
    margin-top: 12px; padding: 15px 44px; font-size: 19px; font-weight: 800;
    border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ffd66b, #ffab3d);
    color: #3b1a55; cursor: pointer; letter-spacing: 0.5px;
    box-shadow: 0 8px 24px rgba(255,171,61,0.4), inset 0 -4px 0 rgba(0,0,0,0.15);
    transition: transform .08s ease;
  }
  button.playBtn:active { transform: scale(0.95); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="best">Best: 0</div>
  </div>
</div>
<div id="tip">Move to aim &middot; tap to drop</div>
<div id="overlay">
  <div id="mascotRow">
    <div class="mascot" style="background:linear-gradient(180deg,#ff8a80,#ff5252)"><div class="smile"></div></div>
    <div class="mascot" style="background:linear-gradient(180deg,#82e9de,#26c6a2)"><div class="smile"></div></div>
    <div class="mascot" style="background:linear-gradient(180deg,#b39dff,#8c6bf0)"><div class="smile"></div></div>
  </div>
  <h1>Stack &amp; Snap</h1>
  <p>Help the little Snaplings pile up! Drop them onto the tilting tray and stack as high as you can before anyone tumbles off.</p>
  <button class="playBtn" id="playBtn">Play</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(function () {
  const { Engine, Runner, World, Bodies, Body, Composite, Events } = Matter;

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');

  const BEST_KEY = 'stackSnapBest';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = 'Best: ' + best;

  // Snapling character palette: [bodyTop, bodyBottom, cheek]
  const SKINS = [
    ['#ff8a80', '#ff5252', '#ff3d6e'],
    ['#ffd166', '#ffb020', '#ff9950'],
    ['#82e9de', '#26c6a2', '#12a58a'],
    ['#8ecdf7', '#3f9ff0', '#2f7fd0'],
    ['#b39dff', '#8c6bf0', '#7a55e0'],
    ['#ffb0d8', '#ff70b8', '#f050a0']
  ];
  const SHAPES = ['box', 'circle', 'triangle'];

  let width, height, dpr;
  let engine, world, runner;
  let tray;
  let currentBody = null;
  let dropX = 0;
  let score = 0;
  let running = false;
  let lastTiltTime = 0;
  let trayWidth = 0;
  let gameOverTriggered = false;
  let shake = 0;
  let particles = [];
  let stars = [];
  let popups = [];
  let rafId = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    makeStars();
  }
  window.addEventListener('resize', resize);

  function makeStars() {
    stars = [];
    const n = Math.floor((width * height) / 14000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 0.6 + Math.random() * 1.6,
        tw: Math.random() * Math.PI * 2,
        sp: 0.4 + Math.random() * 1.2
      });
    }
  }

  function randomShapeBody(x, y) {
    const size = 26 + Math.random() * 20;
    const skin = SKINS[Math.floor(Math.random() * SKINS.length)];
    const type = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    const options = {
      restitution: 0.05,
      friction: 0.9,
      frictionStatic: 1.2,
      density: 0.002
    };
    let body;
    if (type === 'circle') {
      body = Bodies.circle(x, y, size / 1.7, options);
    } else if (type === 'triangle') {
      body = Bodies.polygon(x, y, 3, size / 1.4, options);
    } else {
      body = Bodies.rectangle(x, y, size * 1.3, size * 1.3, options);
    }
    body.label = 'piece';
    body.snap = {
      skin, type, size,
      blinkAt: performance.now() + 1200 + Math.random() * 3200,
      blinkUntil: 0,
      landed: false,
      squash: 0
    };
    return body;
  }

  function setup() {
    engine = Engine.create();
    world = engine.world;
    engine.gravity.y = 1;

    runner = Runner.create();
    Runner.run(runner, engine);

    trayWidth = Math.min(width * 0.6, 420);
    tray = Bodies.rectangle(width / 2, height * 0.78, trayWidth, 26, {
      isStatic: true,
      chamfer: { radius: 6 },
      label: 'tray'
    });

    const leftWall = Bodies.rectangle(-20, height / 2, 40, height * 2, { isStatic: true, label: 'wall' });
    const rightWall = Bodies.rectangle(width + 20, height / 2, 40, height * 2, { isStatic: true, label: 'wall' });

    World.add(world, [tray, leftWall, rightWall]);

    Events.on(engine, 'afterUpdate', gameLoop);
    Events.on(engine, 'collisionStart', onCollision);

    spawnNext();
  }

  function spawnNext() {
    dropX = width / 2;
    currentBody = randomShapeBody(dropX, 78);
    Body.setStatic(currentBody, true);
    World.add(world, currentBody);
  }

  function pointerX(evt) {
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    return Math.max(30, Math.min(width - 30, clientX));
  }

  function onPointerMove(evt) {
    if (!running || !currentBody) return;
    dropX = pointerX(evt);
    Body.setPosition(currentBody, { x: dropX, y: currentBody.position.y });
  }

  function onPointerDown(evt) {
    if (!running || !currentBody) return;
    if (evt.touches) onPointerMove(evt);
    Body.setStatic(currentBody, false);
    currentBody.label = 'piece-falling';
    currentBody = null;
    setTimeout(() => { if (running) spawnNext(); }, 550);
  }

  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('touchmove', (e) => { onPointerMove(e); }, { passive: true });
  canvas.addEventListener('touchstart', (e) => { onPointerDown(e); }, { passive: true });

  function onCollision(evt) {
    for (const pair of evt.pairs) {
      for (const b of [pair.bodyA, pair.bodyB]) {
        if (b.label === 'piece-falling') {
          b.label = 'piece-settled';
          if (b.snap && !b.snap.landed) {
            b.snap.landed = true;
            b.snap.squash = 1;
            const impact = Math.min(Math.abs(b.velocity.y), 14);
            shake = Math.min(shake + impact * 0.7, 10);
            burst(b.position.x, b.position.y + b.snap.size * 0.4, b.snap.skin[1], 6 + impact);
            popups.push({ x: b.position.x, y: b.position.y - 30, text: '+5', life: 1, color: '#ffe9a8' });
          }
        }
      }
    }
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.5,
        r: 2 + Math.random() * 3,
        life: 1,
        color
      });
    }
  }

  function tiltTray(now) {
    if (now - lastTiltTime < 6000) return;
    lastTiltTime = now;
    const maxAngle = 0.22;
    const angle = (Math.random() - 0.5) * 2 * maxAngle;
    Body.setAngle(tray, angle);
    trayWidth = Math.max(140, trayWidth * 0.92);
    Body.scale(tray, trayWidth / (tray.bounds.max.x - tray.bounds.min.x), 1);
    shake = Math.min(shake + 4, 10);
  }

  function computeScore() {
    const settled = Composite.allBodies(world).filter(b => b.label === 'piece-settled');
    if (settled.length === 0) return 0;
    const trayTopY = tray.position.y;
    let maxHeight = 0;
    for (const p of settled) {
      const h = trayTopY - p.position.y;
      if (h > maxHeight) maxHeight = h;
    }
    return Math.max(0, Math.round(maxHeight / 3) + settled.length * 5);
  }

  function checkGameOver() {
    const pieces = Composite.allBodies(world).filter(b => b.label === 'piece-settled' || b.label === 'piece-falling');
    for (const p of pieces) {
      if (p.position.y > height + 60 || p.position.x < -80 || p.position.x > width + 80) {
        return true;
      }
    }
    return false;
  }

  function gameLoop() {
    if (!running) return;
    const now = performance.now();
    tiltTray(now);
    score = computeScore();
    scoreEl.textContent = score;
    if (!gameOverTriggered && checkGameOver()) {
      gameOverTriggered = true;
      endGame();
    }
  }

  // ---------- Custom renderer ----------

  function draw() {
    rafId = requestAnimationFrame(draw);
    const now = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // background
    const bg = ctx.createLinearGradient(0, 0, 0, height);
    bg.addColorStop(0, '#170a33');
    bg.addColorStop(0.55, '#33195a');
    bg.addColorStop(1, '#5e2a66');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    // glow moons
    drawGlow(width * 0.82, height * 0.16, 90, 'rgba(255,190,120,0.10)');
    drawGlow(width * 0.14, height * 0.55, 130, 'rgba(140,110,255,0.10)');

    // stars
    for (const s of stars) {
      const a = 0.25 + 0.55 * Math.abs(Math.sin(s.tw + now * 0.001 * s.sp));
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!world) return;

    // camera shake
    if (shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
    }

    // aim guide
    if (running && currentBody) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 10]);
      ctx.beginPath();
      ctx.moveTo(currentBody.position.x, currentBody.position.y + 34);
      ctx.lineTo(currentBody.position.x, height * 0.9);
      ctx.stroke();
      ctx.restore();
    }

    drawTray(now);

    const bodies = Composite.allBodies(world);
    const tilted = Math.abs(tray ? tray.angle : 0) > 0.12;
    for (const b of bodies) {
      if (!b.snap) continue;
      drawSnapling(b, now, tilted);
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // score popups
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.9; p.life -= 0.022;
      if (p.life <= 0) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.font = '800 20px -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawGlow(x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTray(now) {
    if (!tray) return;
    const w = tray.bounds.max.x - tray.bounds.min.x;
    ctx.save();
    ctx.translate(tray.position.x, tray.position.y);
    ctx.rotate(tray.angle);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    roundRect(-w / 2 + 4, -9, w, 26, 12);
    ctx.fill();

    // wooden plank
    const grad = ctx.createLinearGradient(0, -13, 0, 13);
    grad.addColorStop(0, '#ffbe76');
    grad.addColorStop(0.5, '#f0932b');
    grad.addColorStop(1, '#c96f14');
    ctx.fillStyle = grad;
    roundRect(-w / 2, -13, w, 26, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,25,0,0.55)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // grain lines
    ctx.strokeStyle = 'rgba(120,60,10,0.35)';
    ctx.lineWidth = 1.5;
    for (let i = 1; i <= 3; i++) {
      const gx = -w / 2 + (w / 4) * i;
      ctx.beginPath();
      ctx.moveTo(gx, -8);
      ctx.quadraticCurveTo(gx + 6, 0, gx, 8);
      ctx.stroke();
    }

    // wobble warning glow when steeply tilted
    if (Math.abs(tray.angle) > 0.12) {
      const pulse = 0.25 + 0.2 * Math.sin(now * 0.012);
      ctx.strokeStyle = 'rgba(255,80,80,' + pulse.toFixed(2) + ')';
      ctx.lineWidth = 5;
      roundRect(-w / 2 - 4, -17, w + 8, 34, 15);
      ctx.stroke();
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSnapling(b, now, trayTilted) {
    const s = b.snap;
    const falling = b.label === 'piece-falling';
    const held = b.label === 'piece';

    // squash-and-stretch on landing
    if (s.squash > 0) s.squash = Math.max(0, s.squash - 0.06);
    const sq = s.squash * 0.28;

    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.scale(1 + sq, 1 - sq);

    // soft shadow under body
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, s.size * 0.52, s.size * 0.55, s.size * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    const grad = ctx.createLinearGradient(0, -s.size, 0, s.size);
    grad.addColorStop(0, s.skin[0]);
    grad.addColorStop(1, s.skin[1]);
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(30,10,50,0.5)';
    ctx.lineWidth = 2.5;

    if (s.type === 'circle') {
      const r = s.size / 1.7;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // shine
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.35, -r * 0.45, r * 0.28, r * 0.16, -0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.type === 'triangle') {
      drawWorldPoly(b);
      return; // drawWorldPoly restores context and draws the face itself
    } else {
      const half = s.size * 1.3 / 2;
      roundRect(-half, -half, half * 2, half * 2, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      roundRect(-half + 4, -half + 4, half * 2 - 8, 8, 4);
      ctx.fill();
    }

    drawFace(b, now, falling, held, trayTilted, 0);
    ctx.restore();
  }

  // Triangles need world-space vertex drawing (Matter polygon local coords are offset)
  function drawWorldPoly(b) {
    ctx.restore(); // undo the translate/rotate/scale from drawSnapling
    const s = b.snap;
    const grad = ctx.createLinearGradient(b.position.x, b.position.y - s.size, b.position.x, b.position.y + s.size);
    grad.addColorStop(0, s.skin[0]);
    grad.addColorStop(1, s.skin[1]);
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(30,10,50,0.5)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    const vs = b.vertices;
    ctx.moveTo(vs[0].x, vs[0].y);
    for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // face at centroid, aligned to body angle
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    const falling = b.label === 'piece-falling';
    const held = b.label === 'piece';
    drawFace(b, performance.now(), falling, held, Math.abs(tray ? tray.angle : 0) > 0.12, 4);
    ctx.restore();
  }

  function drawFace(b, now, falling, held, trayTilted, yOff) {
    const s = b.snap;
    const scale = s.size / 36;
    const eyeY = -2 * scale + yOff;
    const eyeDX = 7 * scale;
    const worried = trayTilted && b.label === 'piece-settled';

    // blink cycle
    if (now > s.blinkAt) {
      s.blinkUntil = now + 140;
      s.blinkAt = now + 1600 + Math.random() * 3400;
    }
    const blinking = now < s.blinkUntil;

    // pupils track horizontal velocity a touch
    const look = Math.max(-2.5, Math.min(2.5, b.velocity.x * 1.2));

    ctx.fillStyle = '#241335';
    for (const dir of [-1, 1]) {
      const ex = dir * eyeDX;
      if (blinking) {
        ctx.strokeStyle = '#241335';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(ex - 4 * scale, eyeY);
        ctx.lineTo(ex + 4 * scale, eyeY);
        ctx.stroke();
      } else if (falling) {
        // wide surprised eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex, eyeY, 5.4 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#241335';
        ctx.beginPath();
        ctx.arc(ex + look, eyeY + 1.5, 2.8 * scale, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#241335';
        ctx.beginPath();
        ctx.ellipse(ex + look * 0.6, eyeY, 3.2 * scale, 4.4 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        // sparkle
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(ex + look * 0.6 - 1.1 * scale, eyeY - 1.4 * scale, 1.1 * scale, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // cheeks
    ctx.fillStyle = 'rgba(255,80,110,0.35)';
    for (const dir of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(dir * (eyeDX + 5.5 * scale), eyeY + 5.5 * scale, 3 * scale, 1.8 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // mouth
    const mouthY = eyeY + 8.5 * scale;
    ctx.strokeStyle = '#241335';
    ctx.fillStyle = '#241335';
    ctx.lineWidth = 2.2 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (falling) {
      // little "o" of surprise
      ctx.arc(0, mouthY, 3.2 * scale, 0, Math.PI * 2);
      ctx.fill();
    } else if (worried) {
      // wobbly worried mouth
      const w = 5 * scale;
      ctx.moveTo(-w, mouthY + Math.sin(now * 0.02) * 1.2);
      ctx.quadraticCurveTo(0, mouthY + 3 * scale, w, mouthY + Math.sin(now * 0.02 + 2) * 1.2);
      ctx.stroke();
    } else {
      // happy smile
      ctx.arc(0, mouthY - 1.5 * scale, 4.5 * scale, 0.25 * Math.PI, 0.75 * Math.PI);
      ctx.stroke();
    }
  }

  // ---------- Game state ----------

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bestEl.textContent = 'Best: ' + best;
    overlay.querySelector('h1').textContent = 'Toppled!';
    overlay.querySelector('p').innerHTML = '<span class="scoreLine">Score: ' + score + '</span><br>The Snaplings took a tumble. One more try?';
    playBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    overlay.classList.add('hidden');
    if (runner) Runner.stop(runner);
    if (engine) {
      Events.off(engine);
      Engine.clear(engine);
    }
    score = 0;
    particles = [];
    popups = [];
    shake = 0;
    lastTiltTime = performance.now();
    gameOverTriggered = false;
    currentBody = null;
    scoreEl.textContent = '0';
    resize();
    setup();
    running = true;
  }

  playBtn.addEventListener('click', startGame);
  resize();
  draw();
})();
</script>
