<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪵</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="theme-color" content="#14092b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<title>Stack &amp; Snap — Help Milo balance!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: 'Baloo 2', -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #2a1508;
  }
  #fx { position: fixed; inset: 0; z-index: 0; }
  .momPeek {
    position: fixed; z-index: 1; right: -34px; top: 52%;
    width: min(230px, 48vw); transform: rotate(-13deg);
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 82%);
    mask-image: linear-gradient(180deg, #000 55%, transparent 82%);
    animation: momSway 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes momSway { 0%,100% { transform: rotate(-13deg) translateY(0); } 50% { transform: rotate(-11deg) translateY(-8px); } }

  main {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 4vh 18px 0;
    overflow-y: auto; overflow-x: hidden;
  }
  .card {
    width: 100%; max-width: 400px; text-align: center;
    animation: fadeUp .7s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  #mascotRow { display: flex; gap: 10px; justify-content: center; margin-bottom: 2px; }
  .mascot {
    width: 46px; height: 46px; border-radius: 13px; position: relative;
    animation: bounceM 1.6s ease-in-out infinite;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15), 0 6px 16px rgba(0,0,0,0.35);
  }
  .mascot:nth-child(2) { animation-delay: .2s; border-radius: 50%; }
  .mascot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounceM { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .mascot::before, .mascot::after {
    content: ""; position: absolute; top: 15px; width: 8px; height: 11px;
    background: #241335; border-radius: 50%;
  }
  .mascot::before { left: 11px; }
  .mascot::after { right: 11px; }
  .mascot .smile {
    position: absolute; left: 50%; top: 28px; transform: translateX(-50%);
    width: 14px; height: 7px; border-bottom: 3px solid #241335; border-radius: 0 0 14px 14px;
  }

  h1 {
    margin: 6px 0 2px; font-size: clamp(40px, 11vw, 54px); font-weight: 800; line-height: 1;
    background: linear-gradient(180deg, #ffe9a8, #ff9f43);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45));
    animation: titlePop .8s cubic-bezier(.2, 1.6, .4, 1) both .15s;
  }
  @keyframes titlePop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
  .tagline {
    margin: 0 0 14px; color: #ffe9c9; font-size: 15px; font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6); opacity: .95;
  }

  .playBtn {
    display: inline-block; text-decoration: none;
    padding: 15px 54px; font-size: 21px; font-weight: 800; font-family: inherit;
    border-radius: 999px; color: #3b1a55;
    background: linear-gradient(180deg, #ffd66b, #ffab3d);
    box-shadow: 0 8px 26px rgba(255,171,61,0.45), inset 0 -4px 0 rgba(0,0,0,0.15);
    animation: pulse 1.8s ease-in-out infinite;
    transition: transform .08s ease;
  }
  .playBtn:active { transform: scale(.95); }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .bestChip {
    margin: 12px auto 0; width: fit-content; font-size: 13px; font-weight: 700;
    color: #ffe9a8; background: rgba(30,12,50,0.55); border: 1px solid rgba(255,222,150,0.35);
    padding: 5px 14px; border-radius: 999px; backdrop-filter: blur(4px);
  }

  #authArea { margin-top: 16px; min-height: 44px; }
  .gBtn {
    display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #3c4043;
    background: #fff; border: none; border-radius: 999px; padding: 10px 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform .08s ease;
  }
  .gBtn:active { transform: scale(.96); }
  .userChip {
    display: none; align-items: center; gap: 9px; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px;
  }
  .userChip img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #ffd66b; }
  .userChip button {
    font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    color: #ffd6a0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px; padding: 4px 12px;
  }

  .board {
    margin: 20px 0 26px; width: 100%; border-radius: 20px; padding: 16px 14px 12px;
    background: linear-gradient(180deg, #8a5427, #6b3d16);
    border: 3px solid #4c2a0d;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 2px 0 rgba(255,255,255,0.18);
    animation: fadeUp .7s ease both .25s;
  }
  .board h2 {
    margin: 0 0 10px; font-size: 19px; color: #ffe9a8; letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  .board ol { list-style: none; margin: 0; padding: 0; }
  .board li {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.18); border-radius: 12px;
    padding: 7px 12px; margin-bottom: 6px;
    color: #ffedd2; font-size: 14px; font-weight: 700;
    animation: rowIn .5s ease both;
  }
  .board li:nth-child(1) { animation-delay: .05s; } .board li:nth-child(2) { animation-delay: .1s; }
  .board li:nth-child(3) { animation-delay: .15s; } .board li:nth-child(4) { animation-delay: .2s; }
  .board li:nth-child(5) { animation-delay: .25s; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  .board li.me { outline: 2px solid #ffd66b; }
  .board .rank { width: 26px; text-align: center; font-size: 15px; }
  .board .avatar { width: 26px; height: 26px; border-radius: 50%; background: #4c2a0d; overflow: hidden; flex: none; }
  .board .avatar img { width: 100%; height: 100%; }
  .board .name { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .pts { color: #ffd66b; font-size: 15px; }
  .boardNote { margin-top: 6px; font-size: 12px; font-weight: 600; color: #ffd9ac; opacity: .85; line-height: 1.5; }
  footer { margin-top: auto; padding: 10px 0 14px; font-size: 11px; color: rgba(255,235,210,0.5); z-index: 2; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<img class="momPeek" src="img/mom.png" alt="">

<main>
  <div class="card">
    <div id="mascotRow">
      <div class="mascot" style="background:linear-gradient(180deg,#ff8a80,#ff5252)"><div class="smile"></div></div>
      <div class="mascot" style="background:linear-gradient(180deg,#82e9de,#26c6a2)"><div class="smile"></div></div>
      <div class="mascot" style="background:linear-gradient(180deg,#b39dff,#8c6bf0)"><div class="smile"></div></div>
    </div>
    <h1>Stack &amp; Snap</h1>
    <p class="tagline">Help Milo balance the plank — don't let the Snaplings tumble!</p>
    <a class="playBtn" href="play.html">&#9654;&nbsp; PLAY</a>
    <div class="bestChip" id="bestChip" style="display:none"></div>

    <div id="authArea">
      <button class="gBtn" id="loginBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div class="userChip" id="userChip">
        <img id="userPhoto" alt="">
        <span id="userName"></span>
        <button id="logoutBtn">Sign out</button>
      </div>
    </div>

    <button class="gBtn" id="installBtn" style="display:none; margin-top:10px;">📲 Install app</button>

    <section class="board">
      <h2>🏆 LEADERBOARD</h2>
      <ol id="rows"></ol>
      <div class="boardNote" id="boardNote"></div>
    </section>
  </div>
  <footer>Made with ❤ — works on any phone or computer · v2.6</footer>
</main>

<script>
/* ---------- animated background: falling Snaplings + Milo balancing ---------- */
(function () {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  const bgImg = new Image(); bgImg.src = 'img/bg.png';
  const kidImg = new Image(); kidImg.src = 'img/kid_calm.png';

  const SKINS = [
    ['#ff8a80', '#ff5252'], ['#ffd166', '#ffb020'], ['#82e9de', '#26c6a2'],
    ['#8ecdf7', '#3f9ff0'], ['#b39dff', '#8c6bf0'], ['#ffb0d8', '#ff70b8']
  ];
  const TYPES = ['box', 'circle', 'triangle'];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  window.addEventListener('resize', () => { resize(); seedFallers(); });
  resize();

  function makeFaller(fresh) {
    return {
      x: Math.random() * W,
      y: fresh ? -40 - Math.random() * 80 : Math.random() * H,
      vy: 0.35 + Math.random() * 0.7,
      sway: Math.random() * Math.PI * 2,
      swaySp: 0.4 + Math.random() * 0.8,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.012,
      size: 20 + Math.random() * 26,
      skin: SKINS[Math.floor(Math.random() * SKINS.length)],
      type: TYPES[Math.floor(Math.random() * TYPES.length)],
      blinkAt: performance.now() + Math.random() * 4000, blinkUntil: 0
    };
  }
  const fallers = [];
  function seedFallers() {
    fallers.length = 0;
    const n = Math.max(14, Math.min(40, Math.round(W * H / 55000)));
    for (let i = 0; i < n; i++) fallers.push(makeFaller(false));
  }
  seedFallers();

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSnap(s, now, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    const grad = ctx.createLinearGradient(0, -s.size, 0, s.size);
    grad.addColorStop(0, s.skin[0]);
    grad.addColorStop(1, s.skin[1]);
    ctx.fillStyle = grad;
    ctx.strokeStyle = 'rgba(30,10,50,0.5)';
    ctx.lineWidth = 2.2;
    if (s.type === 'circle') {
      ctx.beginPath(); ctx.arc(0, 0, s.size / 1.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (s.type === 'triangle') {
      const r = s.size / 1.3;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
        i === 0 ? ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      const half = s.size * 0.62;
      roundRect(-half, -half, half * 2, half * 2, 7);
      ctx.fill(); ctx.stroke();
    }
    // face
    if (now > s.blinkAt) { s.blinkUntil = now + 140; s.blinkAt = now + 1800 + Math.random() * 3600; }
    const blink = now < s.blinkUntil;
    const es = s.size / 36;
    ctx.fillStyle = '#241335';
    for (const dir of [-1, 1]) {
      if (blink) {
        ctx.strokeStyle = '#241335'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(dir * 7 * es - 3 * es, -2 * es); ctx.lineTo(dir * 7 * es + 3 * es, -2 * es); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.ellipse(dir * 7 * es, -2 * es, 3 * es, 4.2 * es, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.strokeStyle = '#241335';
    ctx.lineWidth = 2 * es; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 5 * es, 4.5 * es, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,80,110,0.32)';
    for (const dir of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(dir * 12 * es, 3.5 * es, 2.8 * es, 1.6 * es, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Snaplings resting on Milo's plank in the hero scene
  const riders = [
    { lx: -58, type: 'box', skin: SKINS[4], size: 26, blinkAt: 0, blinkUntil: 0, rot: 0, sway: 0, swaySp: 0, x: 0, y: 0, vy: 0, vr: 0 },
    { lx: 2, type: 'circle', skin: SKINS[2], size: 30, blinkAt: 800, blinkUntil: 0, rot: 0, sway: 0, swaySp: 0, x: 0, y: 0, vy: 0, vr: 0 },
    { lx: 55, type: 'triangle', skin: SKINS[0], size: 24, blinkAt: 1600, blinkUntil: 0, rot: 0, sway: 0, swaySp: 0, x: 0, y: 0, vy: 0, vr: 0 }
  ];

  function drawHero(now) {
    if (!kidImg.complete || !kidImg.naturalWidth) return;
    const pivotX = W / 2, pivotY = H * 0.86;
    const angle = Math.sin(now * 0.0009) * 0.055;
    const kw = Math.min(190, W * 0.44);
    const kh = kw * kidImg.naturalHeight / kidImg.naturalWidth;
    // kid
    ctx.save();
    ctx.translate(pivotX - angle * 60, pivotY + 9);
    ctx.rotate(angle * 0.1);
    ctx.drawImage(kidImg, -kw / 2, 0, kw, kh);
    ctx.restore();
    // plank
    const w = Math.min(W * 0.62, 400);
    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    roundRect(-w / 2 + 4, -9, w, 26, 12);
    ctx.fill();
    const grad = ctx.createLinearGradient(0, -13, 0, 13);
    grad.addColorStop(0, '#ffbe76'); grad.addColorStop(0.5, '#f0932b'); grad.addColorStop(1, '#c96f14');
    ctx.fillStyle = grad;
    roundRect(-w / 2, -13, w, 26, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,25,0,0.55)'; ctx.lineWidth = 2.5; ctx.stroke();
    // grip hands
    const handX = Math.min(kw * 0.34, w / 2 - 14);
    for (const dir of [-1, 1]) {
      ctx.fillStyle = '#f6c290';
      ctx.strokeStyle = 'rgba(120,60,20,0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(dir * handX, 7, 11, 8.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    // riders sit on the plank, following its tilt
    for (const r of riders) {
      const lx = r.lx, ly = -13 - r.size * 0.55;
      r.x = pivotX + Math.cos(angle) * lx - Math.sin(angle) * ly;
      r.y = pivotY + Math.sin(angle) * lx + Math.cos(angle) * ly;
      r.rot = angle;
      drawSnap(r, now, 1);
    }
  }

  function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // background art, cover-fit + warm dark overlay for text legibility
    if (bgImg.complete && bgImg.naturalWidth) {
      const s = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
      const dw = bgImg.naturalWidth * s, dh = bgImg.naturalHeight * s;
      ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = '#2a1508'; ctx.fillRect(0, 0, W, H);
    }
    const ov = ctx.createLinearGradient(0, 0, 0, H);
    ov.addColorStop(0, 'rgba(25,8,40,0.62)');
    ov.addColorStop(0.55, 'rgba(25,8,40,0.38)');
    ov.addColorStop(1, 'rgba(25,8,40,0.30)');
    ctx.fillStyle = ov;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < fallers.length; i++) {
      const f = fallers[i];
      f.y += f.vy;
      f.x += Math.sin(now * 0.001 * f.swaySp + f.sway) * 0.4;
      f.rot += f.vr;
      if (f.y > H + 50) fallers[i] = makeFaller(true);
      drawSnap(f, now, 0.7);
    }
    drawHero(now);
  }
  loop();

  const best = parseInt(localStorage.getItem('stackSnapBest') || '0', 10);
  if (best > 0) {
    const chip = document.getElementById('bestChip');
    chip.style.display = 'block';
    chip.textContent = '⭐ Your best: ' + best;
  }
})();
</script>

<script type="module">
/* ---------- Google sign-in + leaderboard (Firebase) ---------- */
import { firebaseConfig } from './firebase-config.js';

const loginBtn = document.getElementById('loginBtn');
const userChip = document.getElementById('userChip');
const userPhoto = document.getElementById('userPhoto');
const userName = document.getElementById('userName');
const logoutBtn = document.getElementById('logoutBtn');
const rows = document.getElementById('rows');
const boardNote = document.getElementById('boardNote');

const configured = firebaseConfig && !String(firebaseConfig.apiKey).includes('PASTE');

if (!configured) {
  boardNote.textContent = 'The online leaderboard & Google sign-in switch on once Firebase is connected (free, 5 min — see SETUP-FIREBASE.md). Your best score is saved on this device meanwhile.';
  loginBtn.addEventListener('click', () => {
    boardNote.textContent = '⚙ Sign-in needs the one-time Firebase setup — open SETUP-FIREBASE.md in the GitHub repo for the 5-minute steps.';
  });
} else {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const { getFirestore, collection, query, orderBy, limit, getDocs, doc, setDoc, getDoc, serverTimestamp } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let me = null;

  loginBtn.addEventListener('click', async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { boardNote.textContent = 'Sign-in failed: ' + e.message; }
  });
  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, async (user) => {
    me = user;
    loginBtn.style.display = user ? 'none' : 'inline-flex';
    userChip.style.display = user ? 'flex' : 'none';
    if (user) {
      userPhoto.src = user.photoURL || '';
      userName.textContent = user.displayName || 'Player';
      // push the locally saved best on first sign-in
      const localBest = parseInt(localStorage.getItem('stackSnapBest') || '0', 10);
      if (localBest > 0) {
        const snap = await getDoc(doc(db, 'scores', user.uid));
        const serverBest = snap.exists() ? (snap.data().score || 0) : 0;
        if (localBest > serverBest) {
          await setDoc(doc(db, 'scores', user.uid), {
            name: user.displayName || 'Player',
            photo: user.photoURL || '',
            score: localBest,
            updatedAt: serverTimestamp()
          }, { merge: true });
        }
      }
    }
    loadBoard();
  });

  async function loadBoard() {
    try {
      const snap = await getDocs(query(collection(db, 'scores'), orderBy('score', 'desc'), limit(10)));
      rows.innerHTML = '';
      const medals = ['🥇', '🥈', '🥉'];
      let i = 0;
      snap.forEach(d => {
        const s = d.data();
        const li = document.createElement('li');
        if (me && d.id === me.uid) li.className = 'me';
        li.innerHTML =
          '<span class="rank">' + (medals[i] || (i + 1)) + '</span>' +
          '<span class="avatar">' + (s.photo ? '<img src="' + s.photo + '" alt="" referrerpolicy="no-referrer">' : '') + '</span>' +
          '<span class="name"></span>' +
          '<span class="pts">' + (parseInt(s.score, 10) || 0) + '</span>';
        li.querySelector('.name').textContent = s.name || 'Player';
        rows.appendChild(li);
        i++;
      });
      boardNote.textContent = i === 0 ? 'No scores yet — be the first on the board!' : '';
    } catch (e) {
      boardNote.textContent = 'Could not load the leaderboard: ' + e.message;
    }
  }
}
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let deferredInstall = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstall = e;
  installBtn.style.display = 'inline-flex';
});
installBtn.addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
</script>
</body>
</html>
